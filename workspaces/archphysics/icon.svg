<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1c21"/>
      <stop offset="1" stop-color="#141518"/>
    </linearGradient>
    <linearGradient id="amberFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="blueFlux" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2e66e6" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#2e66e6"/>
    </linearGradient>
  </defs>

  <!-- Fond anthracite -->
  <rect x="8" y="8" width="496" height="496" rx="96" fill="url(#bg)"/>
  <rect x="8.5" y="8.5" width="495" height="495" rx="95.5" fill="none" stroke="#2b2c32" stroke-width="1.5"/>

  <!-- Sol isométrique (grille) -->
  <g stroke="#2b2c32" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M70 372 L256 480 L442 372"/>
    <path d="M110 349 L256 434 L402 349"/>
    <path d="M150 326 L256 388 L362 326"/>
  </g>

  <!-- Portique arrière (dimmed) -->
  <g stroke="#5b5f6b" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M148 128 L148 258"/>
    <path d="M148 128 L328 232"/>
    <path d="M328 232 L328 362"/>
  </g>

  <!-- Liaisons de profondeur -->
  <g stroke="#7b808e" stroke-width="6" stroke-linecap="round" fill="none">
    <path d="M108 151 L148 128"/>
    <path d="M288 255 L328 232"/>
    <path d="M108 281 L148 258"/>
    <path d="M288 385 L328 362"/>
  </g>

  <!-- Diagramme de flexion (ambre) sous la poutre avant -->
  <path d="M108 151 L288 255 Q198 331 108 151 Z" fill="url(#amberFill)" stroke="none"/>
  <path d="M108 151 Q190 322 288 255" fill="none" stroke="#f59e0b" stroke-width="7" stroke-linecap="round"/>
  <g stroke="#f59e0b" stroke-width="2.5" stroke-opacity="0.7" stroke-linecap="round">
    <path d="M142 171 L142 227"/>
    <path d="M176 191 L176 262"/>
    <path d="M210 210 L210 270"/>
    <path d="M244 229 L244 268"/>
  </g>

  <!-- Portique avant (brillant) -->
  <g stroke="#d8dbe3" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M108 151 L108 281"/>
    <path d="M108 151 L288 255"/>
    <path d="M288 255 L288 385"/>
  </g>
  <!-- Platines -->
  <g fill="#9aa0ae">
    <path d="M86 281 L108 268 L130 281 L108 294 Z"/>
    <path d="M266 385 L288 372 L310 385 L288 398 Z"/>
  </g>

  <!-- Vecteur de flux thermique (bleu) -->
  <g>
    <path d="M300 118 C330 98 350 138 380 118 C410 98 424 112 440 106" fill="none" stroke="url(#blueFlux)" stroke-width="13" stroke-linecap="round"/>
    <path d="M428 82 L472 100 L434 134 Z" fill="#2e66e6" stroke="#2e66e6" stroke-width="6" stroke-linejoin="round"/>
  </g>
</svg>
