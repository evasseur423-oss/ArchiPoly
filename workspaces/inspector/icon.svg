<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a82ff"/>
      <stop offset="1" stop-color="#2e66e6"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="48%" r="55%">
      <stop offset="0" stop-color="#2e66e6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2e66e6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Fond anthracite -->
  <rect x="8" y="8" width="496" height="496" rx="112" fill="#141518"/>
  <rect x="8" y="8" width="496" height="496" rx="112" fill="url(#halo)"/>
  <rect x="9.5" y="9.5" width="493" height="493" rx="110.5" fill="none" stroke="#2b2c32" stroke-width="3"/>

  <!-- Faces de l'octaèdre -->
  <polygon points="256,92 256,342 412,262" fill="url(#glow)" fill-opacity="0.92"/>
  <polygon points="256,420 256,342 412,262" fill="#2e66e6" fill-opacity="0.38"/>
  <polygon points="256,92 100,262 256,342" fill="#ffffff" fill-opacity="0.07"/>
  <polygon points="256,420 100,262 256,342" fill="#ffffff" fill-opacity="0.03"/>

  <!-- Arêtes cachées (fond de l'objet) -->
  <g fill="none" stroke="#2e66e6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 14" opacity="0.95">
    <path d="M256 92 L256 182"/>
    <path d="M256 420 L256 182"/>
    <path d="M100 262 L256 182 L412 262"/>
  </g>

  <!-- Arêtes visibles -->
  <g fill="none" stroke="#f4f6fb" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M256 92 L100 262 L256 420 L412 262 Z"/>
    <path d="M100 262 L256 342 L412 262"/>
    <path d="M256 92 L256 342 L256 420"/>
  </g>

  <!-- Sommets -->
  <g fill="#141518" stroke="#f4f6fb" stroke-width="6">
    <circle cx="256" cy="92" r="13"/>
    <circle cx="100" cy="262" r="13"/>
    <circle cx="412" cy="262" r="13"/>
    <circle cx="256" cy="420" r="13"/>
    <circle cx="256" cy="342" r="13"/>
  </g>
</svg>
