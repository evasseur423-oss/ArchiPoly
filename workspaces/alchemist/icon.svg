<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181a1f"/>
      <stop offset="100%" stop-color="#0e0f11"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3d4352"/>
      <stop offset="100%" stop-color="#1f2229"/>
    </linearGradient>

    <!-- Normal Map Holographic Gradient -->
    <linearGradient id="normalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7e8aff"/>
      <stop offset="50%" stop-color="#49d9c8"/>
      <stop offset="100%" stop-color="#2e66e6"/>
    </linearGradient>

    <!-- Albedo Warm Gradient -->
    <linearGradient id="albedoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="50%" stop-color="#e87348"/>
      <stop offset="100%" stop-color="#8a2be2"/>
    </linearGradient>

    <!-- Blue Core Accent -->
    <linearGradient id="blueAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#548aff"/>
      <stop offset="100%" stop-color="#2e66e6"/>
    </linearGradient>

    <!-- Gloss Specular Highlight -->
    <linearGradient id="glossGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- App Rounded Base Frame -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="4"/>
  <rect x="28" y="28" width="456" height="220" rx="98" fill="url(#glossGrad)"/>

  <!-- Subtle Subtle Background Grid Pattern -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1.5">
    <line x1="128" y1="24" x2="128" y2="488"/>
    <line x1="256" y1="24" x2="256" y2="488"/>
    <line x1="384" y1="24" x2="384" y2="488"/>
    <line x1="24" y1="128" x2="488" y2="128"/>
    <line x1="24" y1="256" x2="488" y2="256"/>
    <line x1="24" y1="384" x2="488" y2="384"/>
  </g>

  <!-- Prism Ray Glow Behind Layers -->
  <circle cx="256" cy="256" r="130" fill="#2e66e6" opacity="0.18" filter="url(#glow)"/>

  <!-- Layer 3 (Bottom): BaseColor / Height Plate -->
  <g transform="translate(0, 70)">
    <polygon points="256,230 380,296 256,362 132,296" fill="#1b1e26" stroke="#2e66e6" stroke-width="2.5" opacity="0.85"/>
    <polygon points="132,296 256,362 256,378 132,312" fill="#13161c"/>
    <polygon points="380,296 256,362 256,378 380,312" fill="#0d0f13"/>
  </g>

  <!-- Layer 2 (Middle): Normal Map Plate -->
  <g transform="translate(0, 0)">
    <polygon points="256,210 395,284 256,358 117,284" fill="url(#normalGrad)" stroke="#6d82f7" stroke-width="3" opacity="0.9"/>
    <!-- Normal Plate Edges -->
    <polygon points="117,284 256,358 256,376 117,302" fill="#1e2954"/>
    <polygon points="395,284 256,358 256,376 395,302" fill="#121835"/>
  </g>

  <!-- Layer 1 (Top): Roughness / Specular Glass Plate -->
  <g transform="translate(0, -70)">
    <polygon points="256,190 380,256 256,322 132,256" fill="#202533" fill-opacity="0.8" stroke="#ffffff" stroke-width="2" stroke-opacity="0.6"/>
    <polygon points="132,256 256,322 256,336 132,270" fill="#181c26"/>
    <polygon points="380,256 256,322 256,336 380,270" fill="#10131a"/>
    <!-- Specular Highlight Line -->
    <line x1="256" y1="190" x2="256" y2="322" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.4"/>
  </g>

  <!-- Central Alchemical Prism Core Light Beam -->
  <g filter="url(#glow)">
    <circle cx="256" cy="256" r="14" fill="#ffffff"/>
    <circle cx="256" cy="256" r="28" fill="#548aff" opacity="0.6"/>
  </g>

  <!-- Decomposition Light Rays -->
  <path d="M 90,140 L 256,256 L 430,170" fill="none" stroke="#2e66e6" stroke-width="3.5" stroke-linecap="round" opacity="0.8"/>
  <path d="M 256,256 L 440,290" fill="none" stroke="#49d9c8" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <path d="M 256,256 L 390,390" fill="none" stroke="#8a2be2" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
</svg>
