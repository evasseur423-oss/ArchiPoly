name: Build macOS Installer

on:
  workflow_dispatch: # Permet de déclencher la compilation d'un clic

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Installer les dépendances
        run: npm ci || npm install

      - name: Compiler pour macOS
        run: npx electron-builder --mac --publish never
        env:
          # Désactive l'exigence de signature payante d'Apple lors de la compilation
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Sauvegarder l'installateur .dmg
        uses: actions/upload-artifact@v4
        with:
          name: Archipoly-macOS
          path: dist/*.dmg